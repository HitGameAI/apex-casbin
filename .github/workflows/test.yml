name: Test

# 实际流程全在 HitGameAI/deploy-pipeline 的 go-library-test.yml 里，所有 Go 库共用一份
# 改那一份就等于改所有库；本文件只保留触发器与平台选择，Go 版本矩阵由流水线按 go.mod 推导
#
# [EN] The pipeline lives in go-library-test.yml in HitGameAI/deploy-pipeline; this file only
# keeps the triggers and the platform choice, and the Go version matrix is derived there

on:
  push:
    branches:
      - master
      - main
      - fork-stable
      - refactor/fork-stable
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  test:
    uses: HitGameAI/deploy-pipeline/.github/workflows/go-library-test.yml@fe59068c93c25b65ce4b9db6e8e5d801533e7d27
    with:
      # GORM uses SQLite. NATS integration tests use a disposable loopback JetStream.
      platforms: '["ubuntu-latest"]'
      coverage-upload: ${{ github.event_name != 'pull_request' }}
      test-flags: ${{ github.event_name == 'pull_request' && '-race -count=1' || '' }}
      setup-script: |
        fixture_dir=$(mktemp -d)
        GOBIN="$fixture_dir" go install github.com/nats-io/nats-server/v2@v2.11.9
        "$fixture_dir/nats-server" --addr 127.0.0.1 --port 4222 --jetstream --store_dir "$fixture_dir/jetstream" > "$fixture_dir/server.log" 2>&1 &
        fixture_pid=$!
        for attempt in $(seq 1 40); do
          kill -0 "$fixture_pid" || { cat "$fixture_dir/server.log"; exit 1; }
          if grep -q 'Server is ready' "$fixture_dir/server.log"; then
            exit 0
          fi
          sleep 0.25
        done
        cat "$fixture_dir/server.log"
        exit 1
    secrets:
      # 显式映射而非 secrets: inherit —— inherit 跨账号调用时拿不到值
      # [EN] Mapped explicitly rather than with secrets: inherit, which yields nothing across accounts
      CODECOV_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CODECOV_TOKEN || '' }}
